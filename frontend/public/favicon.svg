<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Academic Seal -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#070A10"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="2 2"/>

  <!-- Graduation Cap / Crest -->
  <path d="M32 14L48 21L32 28L16 21L32 14Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <path d="M22 24.5V31C22 34.5 26.5 37 32 37C37.5 37 42 34.5 42 31V24.5" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M44 23V34C44 34.5 44.5 35 45 35C45.5 35 46 34.5 46 34V22" stroke="#FDE68A" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="45" cy="35" r="1.5" fill="#FDE68A"/>

  <!-- Blockchain Node Links -->
  <circle cx="24" cy="46" r="3" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <circle cx="32" cy="46" r="3.5" fill="#F59E0B"/>
  <circle cx="40" cy="46" r="3" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="27" y1="46" x2="28.5" y2="46" stroke="#FDE68A" stroke-width="1.5"/>
  <line x1="35.5" y1="46" x2="37" y2="46" stroke="#FDE68A" stroke-width="1.5"/>

  <!-- Laurel Accents -->
  <path d="M14 36C13 32 14 27 16 24" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 3"/>
  <path d="M50 36C51 32 50 27 48 24" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 3"/>
</svg>
